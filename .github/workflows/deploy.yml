name: deploy

on:
  push:
    branches:
      - main

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Trigger the NSM deploy webhook for this project. Configure the project on
      # NSM and store its deploy key as the NSM_KEY secret.
      - name: Deploy via NSM
        env:
          NSM_KEY: ${{ secrets.NSM_KEY }}
        run: |
          if [ -z "$NSM_KEY" ]; then
            echo "::error::NSM_KEY secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run." >&2
            exit 1
          fi
          curl -fsS "https://nsm.mosaiq.dev/deploy/puppy-track/${NSM_KEY}"
