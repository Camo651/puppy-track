services:
  puppy-track:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
    env_file:
      - .env
    volumes:
      # Persistent storage for the SQLite DB. VOLUME_PATH (declared in
      # .env.sample so NSM injects it in production) is the host directory that
      # holds the data; it is bind-mounted to /app/.db, where the app reads and
      # writes. Locally it defaults to ./volumes so `docker compose up` works
      # without extra config.
      - type: bind
        source: ${VOLUME_PATH:-./volumes}/db
        target: /app/.db
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
